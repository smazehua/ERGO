name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  config-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6.0,<7'
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
